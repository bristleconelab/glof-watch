name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Privacy guard
        run: python tests/test_privacy.py
      - name: Monitor rules (no network)
        run: |
          pip install -r requirements.txt pytest
          python -m pytest tests/test_monitor.py -q
